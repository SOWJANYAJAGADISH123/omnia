---
# restart_build_stream.yml — BuildStream Restart Stage
# =====================================================
# Invoked by the playbook watcher when the restart API is called.
# This playbook orchestrates two phases:
#
#   Phase 1: Call orchestrator with --tags pxeboot to PXE boot nodes
#            The orchestrator handles BMC inventory, iDRAC PXE boot,
#            phone-home verification, and writes:
#              - orchestrator_status.yml (per-node status)
#              - failed_nodes.json (failed node details)
#            to OMNIA_DATA_PATH/orchestrator/output/project_default/
#
#   Phase 2: BSM post-processing (reads orchestrator output files):
#            - Read orchestrator results (no shared Ansible facts — subprocess)
#            - Write per-node results (node_results.json) to BSM artifacts
#            - Update restart state (restart_state.json)
#            - Copy failed_nodes.json to restart_state and upload to GitLab
#
# Design note: Phase 1 runs as a subprocess (ansible.builtin.command) so
# orchestrator Ansible facts (groups['bmc'], hostvars) are NOT available in
# Phase 2. All inter-phase data flows through output files on disk.
#
# Required extra_vars:
#   job_id          — Build Stream job identifier
#   image_group_id  — Image group identifier (optional, for tracing)
#
# Inputs:
#   - Orchestrator input: pxe_mapping_file.csv, set_pxe_boot_config.yml
#   - Orchestrator credentials: bmc_username, bmc_password
#   - Build Stream restart state: restart_state.json, failed_nodes.json
#
# Outputs:
#   - node_results.json in build_stream_root/artifacts/{job_id}/
#   - restart_state.json in build_stream_root/restart_state/{job_id}/
#   - failed_nodes.json uploaded to GitLab repository

# =========================================================================
# Play 1: Resolve paths and validate prerequisites
# =========================================================================
- name: Restart stage setup
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Validate job_id is provided
      ansible.builtin.fail:
        msg: >-
          job_id is mandatory but was not provided as an extra variable.
          The playbook watcher must pass job_id via --extra-vars.
      when: job_id is not defined or job_id | length == 0

    - name: Resolve path variables
      ansible.builtin.set_fact:
        omnia_data_path: "{{ lookup('env', 'OMNIA_DATA_PATH') | default('/opt/omnia', true) }}"
        omnia_src_path: "{{ lookup('env', 'OMNIA_SRC_PATH') | default('/opt/omnia/src', true) }}"
        omnia_venv_path: "{{ lookup('env', 'OMNIA_VENV_PATH') | default('/opt/omnia/venv', true) }}"
        cacheable: true

    - name: Set orchestrator and build_stream paths
      ansible.builtin.set_fact:
        orchestrator_playbook_dir: "{{ omnia_src_path }}/orchestrator/playbooks"
        orchestrator_playbook: "{{ omnia_src_path }}/orchestrator/playbooks/orchestrator.yml"
        orchestrator_input_project_dir: "{{ omnia_data_path }}/orchestrator/input/project_default"
        orchestrator_output_project_dir: "{{ omnia_data_path }}/orchestrator/output/project_default"
        build_stream_input_project_dir: "{{ omnia_data_path }}/build_stream/input/project_default"
        restart_state_dir: "{{ omnia_data_path }}/build_stream_root/restart_state"
        node_results_dir: "{{ omnia_data_path }}/build_stream_root/artifacts/{{ job_id }}"
        ansible_playbook_bin: "{{ omnia_venv_path }}/bin/ansible-playbook"
        cacheable: true

    - name: Verify orchestrator playbook exists
      ansible.builtin.stat:
        path: "{{ orchestrator_playbook }}"
      register: orch_playbook_stat

    - name: Fail if orchestrator playbook is missing
      ansible.builtin.fail:
        msg: >-
          Orchestrator playbook not found at {{ orchestrator_playbook }}.
          Ensure the orchestrator domain is installed.
      when: not orch_playbook_stat.stat.exists

    - name: Log restart stage start
      ansible.builtin.debug:
        msg: >-
          [BSM Restart] Starting restart stage for job_id={{ job_id }}.
          Phase 1: Orchestrator PXE boot (--tags pxeboot).
          Phase 2: BSM post-processing (read orchestrator output files).

# =========================================================================
# Play 2: Phase 1 — Invoke orchestrator with --tags pxeboot
# =========================================================================
- name: "Phase 1: PXE boot via orchestrator"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build orchestrator extra_vars
      ansible.builtin.set_fact:
        orch_extra_vars:
          job_id: "{{ job_id }}"
          enable_pxe_boot: true

    - name: "Invoke orchestrator playbook with --tags pxeboot"
      ansible.builtin.command:
        cmd: >-
          {{ ansible_playbook_bin }}
          {{ orchestrator_playbook }}
          --tags pxeboot
          --extra-vars '{{ orch_extra_vars | to_json }}'
          -v
        chdir: "{{ orchestrator_playbook_dir }}"
      register: orchestrator_result
      changed_when: false
      failed_when: false

    - name: Log orchestrator PXE boot result
      ansible.builtin.debug:
        msg: >-
          [BSM Restart] Orchestrator PXE boot completed with
          rc={{ orchestrator_result.rc }}.
          {{ 'SUCCESS' if orchestrator_result.rc == 0 else 'FAILED (proceeding to post-processing)' }}

    - name: Store orchestrator exit code for post-processing decisions
      ansible.builtin.set_fact:
        orchestrator_pxeboot_rc: "{{ orchestrator_result.rc }}"
        cacheable: true

# =========================================================================
# Play 3: Phase 2 — Read orchestrator output and build BSM facts
# The orchestrator subprocess writes:
#   - orchestrator_status.yml  (per-node bmc_ip, status, failure_stage)
#   - failed_nodes.json        (failed node details)
# to orchestrator_output_project_dir. We read these files and build the
# pxe_node_results list that downstream BSM tasks depend on.
# =========================================================================
- name: "Phase 2: Read orchestrator results and build BSM facts"
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Log BSM post-processing start
      ansible.builtin.debug:
        msg: "[BSM Restart] Starting post-processing for job_id={{ job_id }}"

    - name: Check orchestrator_status.yml exists
      ansible.builtin.stat:
        path: "{{ orchestrator_output_project_dir }}/orchestrator_status.yml"
      register: orch_status_stat

    - name: Check orchestrator failed_nodes.json exists
      ansible.builtin.stat:
        path: "{{ orchestrator_output_project_dir }}/failed_nodes.json"
      register: orch_failed_nodes_stat

    - name: Read orchestrator_status.yml
      when: orch_status_stat.stat.exists
      block:
        - name: Load orchestrator status
          ansible.builtin.include_vars:
            file: "{{ orchestrator_output_project_dir }}/orchestrator_status.yml"
            name: orchestrator_status

        - name: Build pxe_node_results from orchestrator output
          ansible.builtin.set_fact:
            pxe_node_results: "{{ orchestrator_status.nodes | default([]) | map('combine_node') | list }}"
          vars:
            # Use a list comprehension via json_query to map fields
            combine_node: ""
          ignore_errors: true

    - name: Build pxe_node_results from orchestrator status nodes
      ansible.builtin.set_fact:
        pxe_node_results: >-
          {{ pxe_node_results | default([]) + [{
            'bmc_ip': item.bmc_ip | default(''),
            'hostname': item.hostname | default(''),
            'service_tag': item.service_tag | default(''),
            'status': item.status | default('failed') | trim,
            'message': (item.failure_stage | default('') | trim) | ternary(
              'Failed at ' + (item.failure_stage | default('') | trim),
              'PXE boot and phone-home completed successfully'
            )
          }] }}
      loop: "{{ orchestrator_status.nodes | default([]) }}"
      when:
        - orch_status_stat.stat.exists
        - orchestrator_status is defined
        - orchestrator_status.nodes is defined

    - name: Default pxe_node_results when orchestrator output is missing
      ansible.builtin.set_fact:
        pxe_node_results: []
      when: not orch_status_stat.stat.exists or orchestrator_status is not defined

    - name: Log orchestrator results summary
      ansible.builtin.debug:
        msg: >-
          [BSM Restart] Orchestrator results:
          total_nodes={{ pxe_node_results | length }},
          success={{ pxe_node_results | selectattr('status', 'equalto', 'success') | list | length }},
          failed={{ pxe_node_results | selectattr('status', 'equalto', 'failed') | list | length }}

    - name: Read PXE mapping CSV for node metadata
      community.general.read_csv:
        path: "{{ orchestrator_input_project_dir }}/pxe_mapping_file.csv"
      register: pxe_csv_data
      failed_when: false

    - name: Build CSV node map for BSM tasks
      ansible.builtin.set_fact:
        pxe_csv_node_map: "{{ dict(pxe_csv_data.list | map(attribute='BMC_IP') | zip(pxe_csv_data.list)) }}"
        current_inventory: "{{ pxe_csv_data.list }}"
        current_bmc_ips: "{{ pxe_csv_data.list | map(attribute='BMC_IP') | list }}"
      when: pxe_csv_data is defined and pxe_csv_data.list is defined

    - name: Default CSV facts when CSV not available
      ansible.builtin.set_fact:
        pxe_csv_node_map: {}
        current_inventory: []
        current_bmc_ips: []
      when: pxe_csv_data is not defined or pxe_csv_data.list is not defined

    - name: Compute booted IPs from this run (for restart_state update)
      ansible.builtin.set_fact:
        booted_ips: "{{ pxe_node_results | selectattr('status', 'equalto', 'success') | map(attribute='bmc_ip') | list }}"
        effective_bmc_ips: "{{ pxe_node_results | map(attribute='bmc_ip') | list }}"
        manually_booted_ips: []

# =========================================================================
# Play 4: Write per-node results and update restart state
# =========================================================================
- name: "Phase 2: BSM write results and update state"
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Ensure artifact directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ node_results_dir }}"
        - "{{ restart_state_dir }}/{{ job_id }}"

    - name: Set bsm_job_id for BSM tasks
      ansible.builtin.set_fact:
        bsm_job_id: "{{ job_id }}"

    - name: Write node_results.json
      ansible.builtin.copy:
        content: "{{ node_results_report | to_nice_json }}"
        dest: "{{ node_results_dir }}/node_results.json"
        mode: "0644"
      vars:
        success_list: "{{ pxe_node_results | default([]) | selectattr('status', 'equalto', 'success') | list }}"
        failed_list: "{{ pxe_node_results | default([]) | selectattr('status', 'equalto', 'failed') | list }}"
        node_results_report:
          job_id: "{{ job_id }}"
          stage_name: "restart"
          timestamp: "{{ ansible_date_time.iso8601 }}"
          total_nodes: "{{ pxe_node_results | default([]) | length }}"
          success_count: "{{ success_list | length }}"
          failure_count: "{{ failed_list | length }}"
          nodes: "{{ pxe_node_results | default([]) }}"

    - name: Update restart state
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: update_restart_state.yml

    - name: Copy orchestrator failed_nodes.json to restart_state dir
      ansible.builtin.copy:
        src: "{{ orchestrator_output_project_dir }}/failed_nodes.json"
        dest: "{{ restart_state_dir }}/{{ job_id }}/failed_nodes.json"
        mode: "0644"
        remote_src: true
      when: orch_failed_nodes_stat.stat.exists | default(false)

    - name: Copy failed_nodes.json to artifacts dir (co-located with node_results.json for result_poller)
      ansible.builtin.copy:
        src: "{{ orchestrator_output_project_dir }}/failed_nodes.json"
        dest: "{{ node_results_dir }}/failed_nodes.json"
        mode: "0644"
        remote_src: true
      when: orch_failed_nodes_stat.stat.exists | default(false)

# =========================================================================
# Play 5: Load credentials and register GitLab host for upload
# The orchestrator subprocess loaded its own credentials, but those facts
# are not available here.  We must decrypt the same credential vault to
# obtain provision_password (needed to SSH into the GitLab server).
# =========================================================================
- name: "Phase 2: Load credentials for GitLab upload"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Set credential file paths
      ansible.builtin.set_fact:
        _cred_file: "{{ orchestrator_input_project_dir }}/omnia_config_credentials.yml"
        _vault_key: "{{ orchestrator_input_project_dir }}/.omnia_config_credentials_key"

    - name: Check credential file existence
      ansible.builtin.stat:
        path: "{{ _cred_file }}"
      register: _cred_stat

    - name: Load credentials from orchestrator vault
      when: _cred_stat.stat.exists
      block:
        - name: Check if credential file is encrypted
          ansible.builtin.shell: >-
            set -o pipefail && head -n1 "{{ _cred_file }}" | grep -q '\$ANSIBLE_VAULT;'
          register: _is_encrypted
          changed_when: false
          failed_when: false

        - name: Include unencrypted credentials directly
          ansible.builtin.include_vars: "{{ _cred_file }}"
          no_log: true
          when: _is_encrypted.rc != 0

        - name: Decrypt, include, and re-encrypt credentials
          when: _is_encrypted.rc == 0
          block:
            - name: Decrypt credential file
              ansible.builtin.command: >-
                ansible-vault decrypt "{{ _cred_file }}"
                --vault-password-file "{{ _vault_key }}"
              changed_when: false

            - name: Include decrypted credentials
              ansible.builtin.include_vars: "{{ _cred_file }}"
              no_log: true

          always:
            - name: Re-encrypt credential file
              ansible.builtin.command: >-
                ansible-vault encrypt "{{ _cred_file }}"
                --vault-password-file "{{ _vault_key }}"
              changed_when: false
              failed_when: false

    - name: Register GitLab host
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: gitlab_host.yml

- name: "Phase 2: Upload failed_nodes.json to GitLab"
  hosts: gitlab_server
  gather_facts: false
  tasks:
    - name: Upload results to GitLab
      ansible.builtin.include_role:
        name: pxe_buildstream_manager
        tasks_from: upload_to_gitlab.yml

# =========================================================================
# Play 6: Final status report
# =========================================================================
- name: "Restart stage summary"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Report restart stage outcome
      ansible.builtin.debug:
        msg: >-
          [BSM Restart] Restart stage completed for job_id={{ job_id }}.
          Orchestrator PXE boot exit code: {{ orchestrator_pxeboot_rc | default('unknown') }}.
          BSM post-processing: complete.
          Total nodes: {{ pxe_node_results | default([]) | length }}.
          Success: {{ pxe_node_results | default([]) | selectattr('status', 'equalto', 'success') | list | length }}.
          Failed: {{ pxe_node_results | default([]) | selectattr('status', 'equalto', 'failed') | list | length }}.
          Artifacts:
            node_results.json  = {{ omnia_data_path }}/build_stream_root/artifacts/{{ job_id }}/node_results.json
            restart_state.json = {{ omnia_data_path }}/build_stream_root/restart_state/{{ job_id }}/restart_state.json
            failed_nodes.json  = {{ omnia_data_path }}/build_stream_root/restart_state/{{ job_id }}/failed_nodes.json

    - name: Fail if orchestrator PXE boot failed and no nodes succeeded
      ansible.builtin.fail:
        msg: >-
          Orchestrator PXE boot failed (rc={{ orchestrator_pxeboot_rc }}).
          Check orchestrator logs for details.
          BSM post-processing completed — failed_nodes.json has been updated.
      when:
        - orchestrator_pxeboot_rc | default('0') | string != '0'
        - pxe_node_results | default([]) | selectattr('status', 'equalto', 'success') | list | length == 0
