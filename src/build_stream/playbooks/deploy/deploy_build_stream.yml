# deploy_build_stream.yml — BuildStream Deploy Stage
# ====================================================
# Invoked by the playbook watcher when the deploy API is called.
# This playbook calls the orchestrator domain with --tags provision
# to provision nodes (SSH preamble, K8s, Slurm, OS, custom).
#
# Usage (via playbook watcher — not run directly):
#   The deploy API submits this playbook to the NFS queue.
#   The playbook watcher executes it with:
#     ansible-playbook deploy_build_stream.yml \
#       --extra-vars '{"job_id": "...", "image_group_id": "..."}'
#
# Required extra_vars:
#   job_id          — Build Stream job identifier
#   image_group_id  — Image group identifier
#
# What it does:
#   Invokes orchestrator.yml --tags provision which runs:
#     - SSH preamble (key distribution + OpenCHAMI auth)
#     - Provision Kubernetes cluster
#     - Provision Slurm cluster
#     - Provision OS-only nodes
#     - Provision custom/user-defined nodes
#     - Validate provisioning

# =========================================================================
# Play 1: Resolve paths and validate prerequisites
# =========================================================================
- name: Deploy stage setup
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate job_id is provided
      ansible.builtin.fail:
        msg: >-
          job_id is mandatory but was not provided as an extra variable.
          The playbook watcher must pass job_id via --extra-vars.
      when: job_id is not defined or job_id | length == 0

    - name: Resolve path variables
      ansible.builtin.set_fact:
        omnia_src_path: "{{ lookup('env', 'OMNIA_SRC_PATH') | default('/opt/omnia/src', true) }}"
        omnia_venv_path: "{{ lookup('env', 'OMNIA_VENV_PATH') | default('/opt/omnia/venv', true) }}"
        cacheable: true

    - name: Set orchestrator paths
      ansible.builtin.set_fact:
        orchestrator_playbook_dir: "{{ omnia_src_path }}/orchestrator/playbooks"
        orchestrator_playbook: "{{ omnia_src_path }}/orchestrator/playbooks/orchestrator.yml"
        ansible_playbook_bin: "{{ omnia_venv_path }}/bin/ansible-playbook"
        cacheable: true

    - name: Verify orchestrator playbook exists
      ansible.builtin.stat:
        path: "{{ orchestrator_playbook }}"
      register: orch_playbook_stat

    - name: Fail if orchestrator playbook is missing
      ansible.builtin.fail:
        msg: >-
          Orchestrator playbook not found at {{ orchestrator_playbook }}.
          Ensure the orchestrator domain is installed.
      when: not orch_playbook_stat.stat.exists

    - name: Log deploy stage start
      ansible.builtin.debug:
        msg: >-
          [BSM Deploy] Starting deploy stage for job_id={{ job_id }},
          image_group_id={{ image_group_id | default('N/A') }}.
          Invoking orchestrator with --tags provision.

# =========================================================================
# Play 2: Invoke orchestrator with --tags provision
# =========================================================================
- name: "Provision via orchestrator"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build orchestrator extra_vars
      ansible.builtin.set_fact:
        orch_extra_vars:
          job_id: "{{ job_id }}"
          image_group_id: "{{ image_group_id | default('') }}"

    - name: "Invoke orchestrator playbook with --tags provision"
      ansible.builtin.command:
        cmd: >-
          {{ ansible_playbook_bin }}
          {{ orchestrator_playbook }}
          --tags provision
          --extra-vars '{{ orch_extra_vars | to_json }}'
          -v
        chdir: "{{ orchestrator_playbook_dir }}"
      register: orchestrator_result
      changed_when: false

    - name: Log orchestrator provision result
      ansible.builtin.debug:
        msg: >-
          [BSM Deploy] Orchestrator provisioning completed with
          rc={{ orchestrator_result.rc }}.

    - name: Report deploy stage outcome
      ansible.builtin.debug:
        msg: >-
          [BSM Deploy] Deploy stage completed for job_id={{ job_id }},
          image_group_id={{ image_group_id | default('N/A') }}.
          Orchestrator provision exit code: {{ orchestrator_result.rc }}.
