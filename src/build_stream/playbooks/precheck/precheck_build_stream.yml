---
# precheck_build_stream.yml — Ensure prerequisite domains are ready.
#
# Invokes ./omnia.sh --prepare-base which runs validate + credentials + prepare
# for repo_manager, image_build_manager, and orchestrator in dependency order.
#
# Usage:
#   ansible-playbook build_stream.yml --tags precheck

- name: Precheck — run prepare-base for prerequisite domains
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - precheck_build_stream
