---
# precheck_build_stream — Main task file
#
# build_stream requires repo_manager, image_build_manager, and orchestrator
# to have completed validate + credentials + prepare.
# Instead of checking each domain individually, we invoke
# ./omnia.sh --prepare-base which runs the full lifecycle for all three
# prerequisite domains in the correct dependency order.

# =========================================================================
# Step 1: Verify omnia.sh exists
# =========================================================================
- name: Verify omnia.sh exists
  ansible.builtin.stat:
    path: "{{ omnia_sh_path }}"
  register: _omnia_sh_check

- name: Fail if omnia.sh is not found
  ansible.builtin.fail:
    msg: >-
      omnia.sh not found at {{ omnia_sh_path }}.
      Set OMNIA_SRC_PATH or run from the omnia source tree.
  when: not _omnia_sh_check.stat.exists

# =========================================================================
# Step 2: Run omnia.sh --prepare-base
# =========================================================================
- name: Run omnia.sh --prepare-base (validate + credentials + prepare for prerequisite domains)
  ansible.builtin.command:
    cmd: "bash {{ omnia_sh_path }} --prepare-base"
  register: _prepare_base_result
  changed_when: false
  failed_when: false

- name: Display prepare-base output
  ansible.builtin.debug:
    msg: "{{ _prepare_base_result.stdout_lines }}"
  when: _prepare_base_result.stdout_lines | length > 0

- name: Fail if prepare-base failed
  ansible.builtin.fail:
    msg: >-
      omnia.sh --prepare-base failed (exit code: {{ _prepare_base_result.rc }}).
      Fix the errors above and re-run: ansible-playbook build_stream.yml --tags precheck
  when: _prepare_base_result.rc != 0
